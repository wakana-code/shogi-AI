/* =========================================================
   人間の操作
   ========================================================= */
function clearSel() {
  G.sel = null;
  G.selTargets = new Set();
}

function canAct() {
  return !G.editing && !G.over && !G.thinking && isHuman(G.turn);
}

function sameSel(m) {
  if (!G.sel) return false;
  if (G.sel.kind === "board") return m.from && m.from[0] === G.sel.r && m.from[1] === G.sel.c;
  return m.drop === G.sel.t;
}

function onCell(r, c) {
  if (!canAct()) return;
  const key = r + "," + c;
  if (G.sel && G.selTargets.has(key)) {
    const cands = G.legal.filter(m => sameSel(m) && m.to[0] === r && m.to[1] === c);
    if (cands.length === 1) {
      playMove(cands[0], G.turn);
    } else {
      askPromote(cands).then(m => {
        if (m) {
          playMove(m, G.turn);
        } else {
          clearSel();
          render();
        }
      });
    }
    return;
  }
  const pc = G.st.board[r][c];
  if (pc && pc.o === G.turn) {
    if (G.sel && G.sel.kind === "board" && G.sel.r === r && G.sel.c === c) {
      clearSel();
    } else {
      G.sel = { kind: "board", r, c };
      G.selTargets = new Set(G.legal.filter(sameSel).map(m => m.to[0] + "," + m.to[1]));
    }
  } else {
    clearSel();
  }
  render();
}

function onHand(t) {
  if (!canAct()) return;
  if (G.sel && G.sel.kind === "hand" && G.sel.t === t) {
    clearSel();
  } else {
    G.sel = { kind: "hand", t };
    G.selTargets = new Set(G.legal.filter(sameSel).map(m => m.to[0] + "," + m.to[1]));
  }
  render();
}

function askPromote(cands) {
  return new Promise(resolve => {
    const m0 = cands[0];
    const pc = G.st.board[m0.from[0]][m0.from[1]];
    $("prevYes").innerHTML = "";
    $("prevNo").innerHTML = "";
    $("prevYes").appendChild(komaEl({ ...pc, p: true }, false, true));
    $("prevNo").appendChild(komaEl({ ...pc, p: false }, false, true));
    const modal = $("promoModal");
    modal.classList.remove("hidden");
    const done = m => {
      modal.classList.add("hidden");
      modal.onclick = null;
      resolve(m);
    };
    $("promoYes").onclick = e => {
      e.stopPropagation();
      done(cands.find(x => x.promote));
    };
    $("promoNo").onclick = e => {
      e.stopPropagation();
      done(cands.find(x => !x.promote));
    };
    modal.onclick = e => {
      if (e.target === modal) done(null);
    };
  });
}

/* =========================================================
   対局進行
   ========================================================= */
function playMove(m, o) {
  G.hist.push({
    st: G.st,
    turn: G.turn,
    kifuLen: G.kifu.length,
    keysLen: G.keys.length,
    last: G.last
  });
  G.kifu.push(moveText(G.st, m, o, G.last));
  G.st = applyMove(G.st, m, o);
  G.last = m.to;
  G.placed = m.to;
  clearSel();
  if (G.sound) pachi();

  const nxt = 1 - o;
  const check = inCheck(G.st.board, nxt);
  const key = posKey(G.st, nxt);
  G.keys.push(key);
  G.turn = nxt;

  if (!hasLegal(G.st, nxt)) {
    if (check) showOute();
    finish(o, check ? "詰み" : "手詰まり");
    return;
  }
  if (G.keys.filter(k => k === key).length >= 4) {
    finish(null, "千日手");
    return;
  }
  if (G.hist.length >= MAX_MOVES) {
    finish(null, "持将棋");
    return;
  }

  render();
  renderKifu();
  if (check) showOute();
  next();
}

function next() {
  if (G.over || G.editing) return;
  const p = G.players[G.turn];
  if (p === "human") {
    G.legal = legalMoves(G.st, G.turn);
    const chk = inCheck(G.st.board, G.turn);
    setStatus(
      chk ? `王手されています！（${sideLabel(G.turn)}）` : `${sideLabel(G.turn)} あなたの番です`,
      chk ? "warn" : ""
    );
    render();
    return;
  }
  G.legal = [];
  if (G.paused) {
    setStatus("一時停止中", "pause");
    render();
    return;
  }
  if (G.thinking) return;
  startAI(p);
}

function startAI(engine) {
  G.thinking = true;
  G.reqId++;
  const req = {
    id: G.reqId,
    engine,
    st: G.st,
    side: G.turn,
    ply: G.hist.length,
    recent: G.keys.slice(-24)
  };
  G.reqStart = performance.now();
  G.reqEngine = engine;
  setStatus(`${sideLabel(G.turn)} ${ENGINES[engine].name} が考えています…`, "think");
  render();
  requestAI(req);
}

function onAIResult(id, res) {
  if (id !== G.reqId) return;
  pending = null;
  const engine = G.reqEngine;
  const minDelay = bothAI() ? G.speed : 350;
  const wait = Math.max(0, minDelay - (performance.now() - G.reqStart));
  setTimeout(() => {
    if (id !== G.reqId || G.over || G.editing) return;
    G.thinking = false;
    if (G.paused) {
      G.held = { res, engine };
      setStatus("一時停止中（AIの手は保留中）", "pause");
      render();
      return;
    }
    applyAI(res, engine);
  }, wait);
}

function applyAI(res, engine) {
  if (!res.move) return;
  const o = G.turn;
  const text = moveText(G.st, res.move, o, G.last);
  logAI(G.hist.length + 1, o, engine, text, res);
  playMove(res.move, o);
}

function cancelAI() {
  G.reqId++;
  if (G.thinking && useWorker && pending && worker) {
    worker.terminate();
    initWorker();
  }
  pending = null;
  G.thinking = false;
  G.held = null;
}

function finish(winner, reason) {
  G.over = true;
  G.thinking = false;
  const n = G.hist.length;
  const resultText = winner === null ? `${reason}で引き分け` : `${MARK[winner]}${playerName(winner)}の勝ち`;
  G.kifu.push(winner === null ? `まで${n}手で${reason}（引き分け）` : `まで${n}手で${SIDE[winner]}の勝ち（${reason}）`);

  const names = [playerName(SENTE), playerName(GOTE)];
  for (const o of [SENTE, GOTE]) {
    const s = G.score[names[o]] || (G.score[names[o]] = { w: 0, l: 0, d: 0 });
    if (winner === null) {
      s.d++;
    } else if (winner === o) {
      s.w++;
    } else {
      s.l++;
    }
  }
  G.games.push({ no: G.games.length + 1, pos: G.startName, p0: names[0], p1: names[1], result: resultText, moves: n });

  render();
  renderKifu();
  renderScore();

  if (bothAI() && $("chkLoop").checked) {
    setStatus(`${resultText}（${reason}） ― 3秒後に先後を入れ替えて同じ局面で次の対局`, "end");
    G.autoTimer = setTimeout(() => {
      const a = $("selSente").value;
      $("selSente").value = $("selGote").value;
      $("selGote").value = a;
      G.players = [$("selSente").value, $("selGote").value];
      newGame();
    }, 3000);
    return;
  }

  setStatus(`${resultText}（${reason}）`, "end");
  setTimeout(() => {
    if (!G.over || G.editing) return;
    let title;
    const humans = G.players.filter(p => p === "human").length;
    if (winner === null) {
      title = "引き分け";
    } else if (humans === 1) {
      title = isHuman(winner) ? "勝ち！" : "負け…";
    } else {
      title = `${SIDE[winner]}の勝ち`;
    }
    $("resultTitle").textContent = title;
    let how = "勝ちました";
    if (reason === "詰み") how = "詰ませました";
    if (reason === "手詰まり") how = "相手を手詰まりにしました";
    $("resultText").textContent = winner === null
      ? `${n}手で${reason}になりました。`
      : `${n}手で${MARK[winner]}${playerName(winner)}が${how}。`;
    $("resultModal").classList.remove("hidden");
  }, 900);
}

function undo() {
  if (!G.hist.length || !G.players.includes("human")) return;
  cancelAI();
  clearTimeout(G.autoTimer);
  let h = G.hist.pop();
  while (!isHuman(h.turn) && G.hist.length) h = G.hist.pop();
  G.st = h.st;
  G.turn = h.turn;
  G.kifu.length = h.kifuLen;
  G.keys.length = h.keysLen;
  G.last = h.last;
  G.over = false;
  clearSel();
  $("resultModal").classList.add("hidden");
  renderKifu();
  next();
}

function newGame() {
  cancelAI();
  clearTimeout(G.autoTimer);
  const pos = G.startPos ? clonePos(G.startPos) : hiratePos();
  G.st = { board: pos.board, hands: pos.hands };
  G.turn = pos.turn;
  G.hist = [];
  G.kifu = [];
  G.keys = [posKey(G.st, G.turn)];
  G.last = null;
  G.over = false;
  G.paused = false;
  G.held = null;
  clearSel();
  G.legal = [];
  if (!isHuman(SENTE) && isHuman(GOTE)) {
    G.flip = true;
  } else if (isHuman(SENTE)) {
    G.flip = false;
  }
  buildLabels();
  $("posName").textContent = `開始局面：${G.startName}`;
  $("aiLog").innerHTML = "";
  $("resultModal").classList.add("hidden");
  render();
  renderKifu();
  next();
}

function onPlayerChange(side, v) {
  G.players[side] = v;
  if (G.editing) return;
  if (G.over) {
    render();
    return;
  }
  if (G.turn === side) {
    if (G.thinking || G.held) cancelAI();
    clearSel();
    next();
  } else {
    render();
  }
}

function togglePause() {
  G.paused = !G.paused;
  if (!G.paused) {
    if (G.held) {
      const h = G.held;
      G.held = null;
      applyAI(h.res, h.engine);
    } else {
      next();
    }
  } else if (!G.thinking && !G.over && !isHuman(G.turn)) {
    setStatus("一時停止中", "pause");
  }
  updateButtons();
}

/* =========================================================
   盤面エディタ
   ========================================================= */
const PALETTE = [
  ["K", false], ["R", false], ["B", false], ["G", false], ["S", false], ["N", false], ["L", false], ["P", false],
  ["R", true], ["B", true], ["S", true], ["N", true], ["L", true], ["P", true]
];

let paint = null;

function enterEdit() {
  cancelAI();
  clearTimeout(G.autoTimer);
  G.paused = false;
  const src = clonePos({ board: G.st.board, hands: G.st.hands, turn: G.turn });
  E.board = src.board;
  E.hands = src.hands;
  E.turn = src.turn;
  E.name = G.hist.length ? "対局途中の局面" : G.startName;
  G.editing = true;
  clearSel();
  document.body.classList.add("edit-mode");
  $("resultModal").classList.add("hidden");
  setStatus("盤面エディタ：駒を好きなだけ置いてください", "edit");
  buildPalette();
  render();
  edChanged();
}

function leaveEdit() {
  G.editing = false;
  paint = null;
  document.body.classList.remove("edit-mode");
}

function cancelEdit() {
  leaveEdit();
  render();
  if (G.over) {
    setStatus("対局終了 ― 新規対局で再開できます", "end");
  } else {
    next();
  }
}

function startFromEditor() {
  if (validatePos(E).errs.length) return;
  G.startPos = clonePos(E);
  G.startName = E.name;
  leaveEdit();
  G.players = [$("selSente").value, $("selGote").value];
  newGame();
}

function buildPalette() {
  const el = $("palette");
  el.innerHTML = "";
  PALETTE.forEach(([t, p], i) => {
    const bt = document.createElement("button");
    bt.className = "pal";
    bt.dataset.idx = i;
    bt.title = p ? PNAME[t] : (t === "K" ? "玉" : KANJI[t]);
    bt.appendChild(komaEl({ t, o: E.owner, p, id: i * 11 + 7 }, false, false));
    bt.addEventListener("click", () => {
      E.tool = { kind: "piece", t, p };
      updateEditorButtons();
    });
    el.appendChild(bt);
  });
  updateEditorButtons();
}

function buildPresets() {
  const el = $("presets");
  const label = document.createElement("span");
  label.className = "ed-label";
  label.textContent = "プリセット";
  el.appendChild(label);
  for (const ps of PRESETS) {
    const bt = document.createElement("button");
    bt.textContent = ps.name;
    bt.title = ps.desc;
    bt.addEventListener("click", () => {
      const pos = ps.make();
      E.board = pos.board;
      E.hands = pos.hands;
      E.turn = pos.turn;
      E.name = ps.name;
      if (G.sound) pachi();
      render();
      edChanged();
    });
    el.appendChild(bt);
  }
}

function updateEditorButtons() {
  document.querySelectorAll("#editor [data-owner]").forEach(b => {
    b.classList.toggle("on", Number(b.dataset.owner) === E.owner);
  });
  document.querySelectorAll("#editor [data-turn]").forEach(b => {
    b.classList.toggle("on", Number(b.dataset.turn) === E.turn);
  });
  document.querySelectorAll("#palette .pal").forEach(b => {
    const [t, p] = PALETTE[Number(b.dataset.idx)];
    b.classList.toggle("on", E.tool.kind === "piece" && E.tool.t === t && E.tool.p === p);
  });
  document.querySelectorAll("#editor [data-tool]").forEach(b => {
    b.classList.toggle("on", E.tool.kind === b.dataset.tool);
  });
}

function edChanged() {
  const v = validatePos(E);
  let html = "";
  for (const e of v.errs) html += `<div class="err">✖ ${e}</div>`;
  for (const w of v.warns) html += `<div class="warn">⚠ ${w}</div>`;
  html += `<div class="info">${v.info}</div>`;
  $("edCheck").innerHTML = html;
  $("edStart").disabled = v.errs.length > 0;
  $("edName").textContent = `［${E.name}］`;
  updateEditorButtons();
}

function cellFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  const cell = el && el.closest ? el.closest(".cell") : null;
  if (!cell || cell.dataset.r === undefined) return null;
  return [Number(cell.dataset.r), Number(cell.dataset.c)];
}

function paintAt(r, c) {
  const k = r * 9 + c;
  if (paint.seen.has(k)) return;
  paint.seen.add(k);
  const pc = E.board[r][c];
  const tool = paint.erase ? { kind: "erase" } : E.tool;
  if (tool.kind === "piece") {
    E.board[r][c] = newPiece(tool.t, E.owner, tool.p);
    G.placed = [r, c];
    if (G.sound) pachi();
  } else if (tool.kind === "erase") {
    E.board[r][c] = null;
  } else if (tool.kind === "flip") {
    if (pc) E.board[r][c] = { ...pc, o: 1 - pc.o };
  } else if (tool.kind === "promote") {
    if (pc && PROMOTABLE.includes(pc.t)) E.board[r][c] = { ...pc, p: !pc.p };
  }
  E.name = "カスタム";
  render();
}

function setupEditorBoard() {
  const boardEl = $("board");
  boardEl.addEventListener("pointerdown", e => {
    if (!G.editing) return;
    e.preventDefault();
    const rc = cellFromPoint(e.clientX, e.clientY);
    if (!rc) return;
    try {
      boardEl.setPointerCapture(e.pointerId);
    } catch (err) {
      // 無視
    }
    paint = { erase: e.button === 2, seen: new Set() };
    paintAt(rc[0], rc[1]);
  });
  boardEl.addEventListener("pointermove", e => {
    if (!G.editing || !paint) return;
    const rc = cellFromPoint(e.clientX, e.clientY);
    if (rc) paintAt(rc[0], rc[1]);
  });
  const end = () => {
    if (paint) {
      paint = null;
      edChanged();
    }
  };
  boardEl.addEventListener("pointerup", end);
  boardEl.addEventListener("pointercancel", end);
  boardEl.addEventListener("contextmenu", e => {
    if (G.editing) e.preventDefault();
  });
}

function setupEditorControls() {
  document.querySelectorAll("#editor [data-owner]").forEach(b => {
    b.addEventListener("click", () => {
      E.owner = Number(b.dataset.owner);
      buildPalette();
    });
  });
  document.querySelectorAll("#editor [data-turn]").forEach(b => {
    b.addEventListener("click", () => {
      E.turn = Number(b.dataset.turn);
      edChanged();
    });
  });
  document.querySelectorAll("#editor [data-tool]").forEach(b => {
    b.addEventListener("click", () => {
      E.tool = { kind: b.dataset.tool };
      updateEditorButtons();
    });
  });
  $("edSwap").addEventListener("click", () => {
    const nb = Array.from({ length: 9 }, () => Array(9).fill(null));
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        const pc = E.board[r][c];
        if (pc) nb[8 - r][8 - c] = { ...pc, o: 1 - pc.o };
      }
    }
    E.board = nb;
    E.hands = [E.hands[1], E.hands[0]];
    E.turn = 1 - E.turn;
    E.name = "カスタム";
    render();
    edChanged();
  });
  $("edMirror").addEventListener("click", () => {
    E.board = E.board.map(row => row.slice().reverse());
    E.name = "カスタム";
    render();
    edChanged();
  });
  $("edClearBoard").addEventListener("click", () => {
    E.board = Array.from({ length: 9 }, () => Array(9).fill(null));
    E.name = "カスタム";
    render();
    edChanged();
  });
  $("edClearHands").addEventListener("click", () => {
    E.hands = [emptyHand(), emptyHand()];
    E.name = "カスタム";
    render();
    edChanged();
  });
  $("sfenOut").addEventListener("click", () => {
    $("sfenBox").value = toSFEN(E);
    $("sfenBox").select();
  });
  $("sfenIn").addEventListener("click", () => {
    try {
      const pos = fromSFEN($("sfenBox").value);
      E.board = pos.board;
      E.hands = pos.hands;
      E.turn = pos.turn;
      E.name = "SFEN読込";
      render();
      edChanged();
    } catch (err) {
      $("edCheck").innerHTML = `<div class="err">✖ SFENを読み込めません：${err.message}</div>`;
    }
  });
  $("edStart").addEventListener("click", startFromEditor);
  $("edCancel").addEventListener("click", cancelEdit);
}

/* =========================================================
   駒音（パチッ）
   ========================================================= */
let actx = null;
function pachi() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const len = Math.floor(actx.sampleRate * 0.07);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 7);
    }
    const src = actx.createBufferSource();
    src.buffer = buf;
    const bp = actx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 2400;
    bp.Q.value = 1.4;
    const g = actx.createGain();
    g.gain.value = 1.6;
    src.connect(bp).connect(g).connect(actx.destination);
    src.start(t);

    const osc = actx.createOscillator();
    const og = actx.createGain();
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(140, t + 0.05);
    og.gain.setValueAtTime(0.45, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    osc.connect(og).connect(actx.destination);
    osc.start(t);
    osc.stop(t + 0.07);
  } catch (e) {
    // 音が鳴らせない環境では無視
  }
}

/* =========================================================
   起動
   ========================================================= */
function buildSelects() {
  for (const [id, side] of [["selSente", SENTE], ["selGote", GOTE]]) {
    const sel = $(id);
    for (const key of ENGINE_ORDER) {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = `${ENGINES[key].name} ― ${ENGINES[key].desc}`;
      sel.appendChild(opt);
    }
    sel.value = G.players[side];
    sel.addEventListener("change", () => onPlayerChange(side, sel.value));
  }
}

$("btnNew").addEventListener("click", () => {
  G.players = [$("selSente").value, $("selGote").value];
  newGame();
});

$("btnAuto").addEventListener("click", () => {
  if ($("selSente").value === "human") $("selSente").value = "s3";
  if ($("selGote").value === "human") $("selGote").value = "chaos";
  G.players = [$("selSente").value, $("selGote").value];
  newGame();
});

$("btnEdit").addEventListener("click", enterEdit);

$("btnChaos").addEventListener("click", () => {
  G.startPos = randomChaos();
  G.startName = "ランダムカオス";
  G.players = [$("selSente").value, $("selGote").value];
  newGame();
});

$("btnHirate").addEventListener("click", () => {
  G.startPos = null;
  G.startName = "平手";
  G.players = [$("selSente").value, $("selGote").value];
  newGame();
});

$("btnPause").addEventListener("click", togglePause);
$("btnUndo").addEventListener("click", undo);

$("btnHint").addEventListener("click", () => {
  if (canAct()) {
    clearSel();
    startAI(HINT_ENGINE);
  }
});

$("btnFlip").addEventListener("click", () => {
  G.flip = !G.flip;
  buildLabels();
  render();
});

$("btnSound").addEventListener("click", () => {
  G.sound = !G.sound;
  $("btnSound").textContent = "駒音：" + (G.sound ? "ON" : "OFF");
});

$("selSpeed").addEventListener("change", e => {
  G.speed = Number(e.target.value);
});

$("btnAgain").addEventListener("click", () => {
  G.players = [$("selSente").value, $("selGote").value];
  newGame();
});

buildSelects();
buildPresets();
setupEditorBoard();
setupEditorControls();
initWorker();
renderScore();
newGame();
</script>
